[project]
site_name = "asgi-profiler"
site_url = "https://asgi-profiler.netlify.app/"
site_description = "Request and SQL profiling for ASGI apps: Starlette, FastAPI, SQLAlchemy"
site_author = "Miradil Zeynalli"

copyright = "Copyright &copy; 2026 Miradil Zeynalli"

repo_url = "https://github.com/mmzeynalli/asgi-profiler"
repo_name = "mmzeynalli/asgi-profiler"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/quickstart.md",
  ] },
  { "Guide" = [
    "guide/what-it-shows.md",
    "guide/filtering.md",
    "guide/configuration.md",
    "guide/storage.md",
    "guide/security.md",
    "guide/json.md",
  ] },
  { "Integrations" = [
    "integrations/sqladmin.md",
    "integrations/fastapi.md",
  ] },
  { "Reference" = [
    "reference/api.md",
    "reference/cli.md",
  ] },
  { "How it works" = "how-it-works.md" },
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
favicon = "assets/logo-icon.svg"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "assets/logo-icon.svg"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/mmzeynalli/asgi-profiler"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/asgi-profiler/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
