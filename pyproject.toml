[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asgi-profiler"
version = "0.1.0"
description = "Request and SQL profiling for ASGI apps: Starlette, FastAPI, SQLAlchemy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "asgi",
  "starlette",
  "fastapi",
  "sqlalchemy",
  "sqlmodel",
  "profiler",
  "profiling",
  "n+1",
  "sql",
  "silk",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  # 0.35 is where `scope["path"]` stopped being stripped of the mount
  # prefix. Below it the profiler records the wrong route for every
  # mounted app -- silently, by writing bad data rather than raising.
  "starlette>=0.35",
  "sqlalchemy>=2.0",
  "jinja2>=3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov",
  # Starlette's TestClient requires httpx on older releases and httpx2 on
  # newer ones; install both so the suite runs against either.
  "httpx",
  "httpx2",
  "aiosqlite",
  "anyio",
  # FastAPI and SQLModel are both claimed as supported in the README. Without
  # them here the tests covering them skip in silence, which is the worst of
  # both: a support claim resting on nothing.
  "fastapi",
  "sqlmodel",
]
dev = ["ruff", "ty", "bandit", "pre-commit", "uvicorn"]

[project.urls]
Source = "https://github.com/mmzeynalli/asgi-profiler"
Issues = "https://github.com/mmzeynalli/asgi-profiler/issues"
Changelog = "https://github.com/mmzeynalli/asgi-profiler/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/asgi_profiler"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "examples",
  # assets: the README the sdist ships references the logo by relative path.
  "assets",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  # CONTRIBUTING tells you to run it, so it has to be here to run.
  ".pre-commit-config.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "F",  # Pyflakes
  "E",  # Pycodestyle
  "W",  # warnings
  "I",  # isort
  "T",  # Ban print statements (T201)
  "B",  # flake8-bugbear
  "UP", # pyupgrade (modern typing / syntax fixes)
]

[tool.ruff.lint.per-file-ignores]
"src/asgi_profiler/__main__.py" = ["T201"]

[project.scripts]
asgi-profiler = "asgi_profiler.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Our own deprecations are errors; upstream's are not. A blanket
  # `error::DeprecationWarning` turns any dependency's internal rename into a
  # red build on a green codebase, which trains everyone to ignore CI.
  "default",
  "error::DeprecationWarning:asgi_profiler",
]

[tool.coverage.run]
branch = true
source = ["src/asgi_profiler"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
