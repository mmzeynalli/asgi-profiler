name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. The coverage job widens this for itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --locked
      - name: Test
        run: uv run --no-sync pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - name: Type check (ty)
        run: uv run --no-sync ty check src/asgi_profiler
      - name: Security scan
        # src only: the suite is full of asserts and temp paths, which bandit
        # flags by design and which say nothing about the shipped package.
        run: uv run --no-sync bandit -q -r src/asgi_profiler

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv build --no-sources
      # uv has no metadata validator, and a README that PyPI refuses to render
      # is only discovered at upload time. uvx runs twine without adding it to
      # the project's dependencies.
      - run: uvx twine check --strict dist/*
      - name: The wheel installs and imports on its own
        run: |
          uv run --no-project --refresh-package asgi-profiler \
            --with dist/*.whl -- python -c "
          import asgi_profiler
          print('imported', asgi_profiler.__version__)
          "

  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run --no-sync pytest -q --cov --cov-report=html --cov-fail-under=90
      - name: Publish the coverage report and badge
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Coverage {coverage-percentage}
          SMOKESHOW_GITHUB_COVERAGE_THRESHOLD: 90
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }}
        # Skipped until the key is configured, so the README's coverage badge
        # can be set up after the first push without a red build in between.
        run: |
          if [ -z "$SMOKESHOW_AUTH_KEY" ]; then
            echo "SMOKESHOW_AUTH_KEY is not set - skipping the coverage upload."
            exit 0
          fi
          uvx smokeshow upload htmlcov
